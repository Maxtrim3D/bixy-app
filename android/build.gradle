buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion    = 24          // Android 7+, required by WireGuard Go
        compileSdkVersion = 34
        targetSdkVersion  = 34
        ndkVersion        = "26.1.10909125"
        kotlinVersion     = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

// Force all com.facebook.react artifacts (react-android, hermes-android, etc.) to resolve
// exclusively from the local node_modules Maven repo, never from Maven Central.
// This guarantees rn_edit_text_material and other bundled resources are found.
allprojects {
    repositories {
        maven { url uri("$rootDir/../node_modules/react-native/android") }
        maven { url uri("$rootDir/../node_modules/jsc-android/dist") }
        google()
        mavenCentral {
            content {
                excludeGroup "com.facebook.react"
            }
        }
        maven { url 'https://www.jitpack.io' }
    }
}
