name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Code ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── 3. JDK 17 ─────────────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ── 4. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Dépendances JS ────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm install

      # ── 6. Verify Gradle plugin setup ────────────────────────────────────
      # com.facebook.react.settings was removed from android/settings.gradle
      # because ReactSettingsPlugin does not exist in @react-native/gradle-plugin@0.73.4.
      # Autolinking is handled by ReactPlugin in app/build.gradle.
      - name: Verify Gradle plugin setup
        run: |
          echo "=== @react-native/gradle-plugin version ==="
          python3 -c "import json; d=json.load(open('node_modules/@react-native/gradle-plugin/package.json')); print('version:', d['version'])" 2>/dev/null || echo "?"
          echo ""
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle

      # ── 7. Gradle wrapper JAR ─────────────────────────────────────────────
      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      # ── 8. Keystore debug ────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bixy Debug,O=Maxtrim3D,C=BE" \
            -storepass android -keypass android

      # ── 9. gradlew exécutable ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build APK ─────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      # ── 11. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bixy-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. Résumé ────────────────────────────────────────────────────────
      - name: Summary
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh $APK | cut -f1)
          echo "APK Bixy: app-debug.apk - Taille: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "Telecharge dans l'onglet Artifacts." >> $GITHUB_STEP_SUMMARY
