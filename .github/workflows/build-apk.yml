name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. JS dependencies (pinned exact versions - no lockfile drift)
      - name: Install Node dependencies
        run: npm install

      # 6. Verify Gradle plugin setup
      - name: Verify Gradle plugin setup
        run: |
          echo "=== @react-native/gradle-plugin version ==="
          node -e "console.log(require('./node_modules/@react-native/gradle-plugin/package.json').version)" 2>/dev/null || echo "?"
          echo ""
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle

      # 7. Gradle wrapper JAR
      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.3.0/gradle/wrapper/gradle-wrapper.jar"
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      # 8. Debug keystore (used for release signing in CI - see app/build.gradle signingConfigs)
      - name: Generate debug keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bixy Debug,O=Maxtrim3D,C=BE" \
            -storepass android -keypass android

      # 9. gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 10. Build release APK
      # assembleRelease always bundles the JS - no Metro server needed on device.
      # The release build type uses signingConfigs.debug (see app/build.gradle)
      # so the keystore generated above is used for signing.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      # 11. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bixy-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # 12. Summary
      - name: Summary
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIZE=$(du -sh $APK | cut -f1)
          echo "APK Bixy: app-release.apk - Taille: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "Telecharge dans l'onglet Artifacts." >> $GITHUB_STEP_SUMMARY
