name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Récupérer le code ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── 3. JDK 17 ─────────────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ── 4. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Installer les dépendances JS ──────────────────────────────────
      - name: Install Node dependencies
        run: npm install

      # ── 6. Debug + fix React Native Gradle plugin ─────────────────────────
      - name: Fix React Native Gradle plugin
        run: |
          PLUGIN_DIR="node_modules/@react-native/gradle-plugin"
          echo "=== Contents of $PLUGIN_DIR ==="
          ls -la "$PLUGIN_DIR/" || echo "(directory missing)"

          # Gradle includeBuild needs settings.gradle.kts — create it if missing
          if [ ! -f "$PLUGIN_DIR/settings.gradle.kts" ] && [ ! -f "$PLUGIN_DIR/settings.gradle" ]; then
            echo 'rootProject.name = "react-native-gradle-plugin"' > "$PLUGIN_DIR/settings.gradle.kts"
            echo "✅ Created missing settings.gradle.kts"
          else
            echo "✅ settings.gradle already present"
          fi

          # Check for build.gradle.kts
          if [ ! -f "$PLUGIN_DIR/build.gradle.kts" ] && [ ! -f "$PLUGIN_DIR/build.gradle" ]; then
            echo "⚠️ build.gradle.kts missing — contents:"
            find "$PLUGIN_DIR" -name "*.gradle*" -o -name "*.jar" 2>/dev/null | head -20
          else
            echo "✅ build.gradle found"
          fi

      # ── 7. Télécharger gradle-wrapper.jar ────────────────────────────────
      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar"
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      # ── 8. Keystore de debug ──────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bixy Debug,O=Maxtrim3D,C=BE" \
            -storepass android -keypass android

      # ── 9. Rendre gradlew exécutable ──────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build APK debug ───────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      # ── 11. Upload APK ─────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bixy-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. Résumé ─────────────────────────────────────────────────────────
      - name: Summary
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh $APK | cut -f1)
          echo "## ✅ APK Bixy généré" >> $GITHUB_STEP_SUMMARY
          echo "**Fichier :** \`app-debug.apk\` · **Taille :** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "👉 Télécharge l'APK dans l'onglet **Artifacts** ci-dessus." >> $GITHUB_STEP_SUMMARY
