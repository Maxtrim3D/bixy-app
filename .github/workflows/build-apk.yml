name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Code ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ────────────────────────────────────────────────────────
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── 3. JDK 17 ─────────────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ── 4. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Dépendances JS ────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm install

      # ── 6. Diagnostics + patch gradle plugin ─────────────────────────────
      - name: Diagnose and fix React Native Gradle plugin
        run: |
          PLUGIN_DIR="node_modules/@react-native/gradle-plugin"

          echo "=== npm package version ==="
          cat "$PLUGIN_DIR/package.json" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print('version:', d.get('version','?'))" || echo "(no package.json)"

          echo ""
          echo "=== Directory tree (3 levels) ==="
          find "$PLUGIN_DIR" -maxdepth 3 | sort | head -80 || echo "(error)"

          echo ""
          echo "=== settings.gradle.kts (original) ==="
          cat "$PLUGIN_DIR/settings.gradle.kts" 2>/dev/null || echo "(missing)"

          echo ""
          echo "=== settings.gradle (original) ==="
          cat "$PLUGIN_DIR/settings.gradle" 2>/dev/null || echo "(missing)"

          echo ""
          echo "=== build.gradle.kts (first 60 lines) ==="
          head -60 "$PLUGIN_DIR/build.gradle.kts" 2>/dev/null || echo "(missing)"

          echo ""
          echo "=== build.gradle (first 60 lines) ==="
          head -60 "$PLUGIN_DIR/build.gradle" 2>/dev/null || echo "(missing)"

          echo ""
          echo "=== Replacing settings.gradle.kts with full repo config ==="
          # NOTE: no heredoc (breaks YAML) — use echo lines instead
          {
            echo 'pluginManagement {'
            echo '    repositories {'
            echo '        google()'
            echo '        mavenCentral()'
            echo '        gradlePluginPortal()'
            echo '    }'
            echo '}'
            echo 'rootProject.name = "react-native-gradle-plugin"'
          } > "$PLUGIN_DIR/settings.gradle.kts"
          echo "✅ settings.gradle.kts rewritten"
          cat "$PLUGIN_DIR/settings.gradle.kts"

          echo ""
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle

      # ── 7. Gradle wrapper JAR ─────────────────────────────────────────────
      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar"
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      # ── 8. Keystore debug ────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bixy Debug,O=Maxtrim3D,C=BE" \
            -storepass android -keypass android

      # ── 9. gradlew exécutable ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build APK ─────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      # ── 11. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bixy-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. Résumé ────────────────────────────────────────────────────────
      - name: Summary
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh $APK | cut -f1)
          echo "## APK Bixy generé" >> $GITHUB_STEP_SUMMARY
          echo "Fichier: app-debug.apk · Taille: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "Telecharge l'APK dans l'onglet Artifacts." >> $GITHUB_STEP_SUMMARY
